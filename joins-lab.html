(--fg);font-weight:600;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--accent)}select{width:100%;padding:5px;background:#24262b;color:var(--fg);border:1px solid var(--line);border-radius:6px}.box{border-left:3px solid var(--line);background:#202228;border-radius:4px;padding:7px 9px;margin-bottom:7px}.box.ok{border-color:var(--ok)}.box.warn{border-color:var(--warn)}.box.bad{border-color:var(--bad)}.box b{font-variant-numeric:tabular-nums}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td{padding:2px 0;color:var(--muted)}td+td{text-align:right;color:var(--fg)}.row{display:flex;gap:6px}.row button{flex:1}.mat{fill:#35373e;stroke:#5a5f6b;stroke-width:.18}.cut{fill:none;stroke:var(--accent);stroke-width:.18;stroke-linejoin:round}.hole{fill:#16171a;stroke:var(--accent);stroke-width:.18}.ghost{fill:none;stroke:#5a5f6b;stroke-width:.12;stroke-dasharray:.8 .6}.dim{stroke:var(--blue);stroke-width:.1}text{font:2.1px system-ui,sans-serif;fill:var(--muted)}text.lock{fill:var(--ok)}text.hit{fill:var(--warn)}</style></head><body><div class="app"><div class="bar"><span class="brand">Uniones a presión</span><div class="sep"></div><button data-view="ambas" class="active">Ambas vistas</button> <button data-view="piezas">Las dos caras</button> <button data-view="insercion">Inserción</button><div class="sep"></div><button id="play">Montar</button> <button id="unplay">Desmontar</button> <button id="svg">Exportar SVG</button></div><div class="views" id="views"><div class="card" id="vPzs"><h2>Las dos caras · macho con dedos y hembra con agujeros</h2><svg id="s2d" preserveAspectRatio="xMidYMid meet"></svg></div><div class="card" id="vIns"><h2>Inserción · planta, con los brazos cerrándose</h2><svg id="sIns" preserveAspectRatio="xMidYMid meet"></svg></div></div><div class="panel"><h3>Sistema</h3><select id="style"><option value="clip" selected="selected">Clip propio (traba)</option><option value="snap">Gancho de boxes.py</option><o
