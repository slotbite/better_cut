<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio de regletas 2D</title><style>:root{--bg:#141517;--surface:#1e1f23;--line:#2d2f36;--fg:#e8e9ec;--muted:#9ba1ab;--accent:#ff7a1a;--ok:#46a758;--warn:#e5a000;--bad:#e5484d;--blue:#3e8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,sans-serif}.app{display:grid;grid-template-columns:1fr 300px;grid-template-rows:44px 1fr;height:100vh}.bar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}.brand{font-weight:600}.sep{width:1px;height:22px;background:var(--line)}a.back{color:var(--muted);text-decoration:none}a.back:hover{color:var(--fg)}button{font:inherit;color:var(--fg);background:#24262b;border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}button:hover{border-color:#414550}.view{display:flex;flex-direction:column;gap:6px;min-height:0;padding:10px}.card{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:radial-gradient(900px 600px at 50% 40%,#232428 0,var(--bg) 70%)}.card h2{margin:0;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}svg#side{flex:1;min-height:0;width:100%}.panel{padding:10px;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line)}.panel h3{margin:14px 0 6px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}.panel h3:first-child{margin-top:0}.fld{margin-bottom:8px}.fld label{display:flex;justify-content:space-between;gap:8px;color:var(--muted);margin-bottom:2px}.fld label b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--accent)}input[type=number],select{width:100%;padding:5px;background:#24262b;color:var(--fg);border:1px solid var(--line);border-radius:6px;font:inherit}.row{display:flex;gap:6px;flex-wrap:wrap}.row button{flex:1}.box{border-left:3px solid var(--line);background:#202228;border-radius:4px;padding:7px 9px;margin-bottom:7px;font-variant-numeric:tabular-nums}.box.ok{border-color:var(--ok)}.box.warn{border-color:var(--warn)}.note{color:var(--muted);font-size:12px}.chk{display:grid;grid-template-columns:10px 1fr auto;gap:2px 8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}.chk:last-child{border-bottom:0}.chk .dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}.chk[data-ok=true] .dot{background:var(--ok)}.chk .nm{color:var(--fg)}.chk .val{font-variant-numeric:tabular-nums;text-align:right}.chk .lim{grid-column:2/-1;color:var(--muted);font-size:11.5px}.wood{fill:#c9a06a;stroke:#7a5a32;stroke-width:.3}.base{fill:#8a8f99;stroke:#565b66;stroke-width:.3}.free{fill:#46a758;fill-opacity:.32}.link{fill:rgba(70,74,84,.38);stroke:#000;stroke-width:.6;stroke-linejoin:round}.link.long{fill:rgba(40,42,50,.45)}.hole{fill:#0d0e10}text.lbl{fill:var(--muted);font-size:5px}.dim{stroke:#c9ccd3;stroke-width:.35;fill:none;pointer-events:none}text.dimt{pointer-events:none;fill:#e8e9ec;font-size:5.2px;font-weight:600;paint-order:stroke;stroke:#141517;stroke-width:1.4px}.grip{fill:var(--accent);stroke:#141517;stroke-width:.6;cursor:ns-resize}.grip.h{cursor:ew-resize}.jointline{fill:none;stroke:#f4f1ea;stroke-width:.45;stroke-dasharray:1.6 1.1;opacity:.85;pointer-events:none}#btnJoints.on{border-color:var(--accent);color:var(--accent)}.grip.drag,.grip:hover{r:3.6;fill:#ffa45c}#side.dragging{cursor:grabbing}#side .dims{transition:opacity .2s}#side.abierta .dims{opacity:.3}#side.abierta .dims:hover{opacity:1}</style></head><body><div class="app"><div class="bar"><a class="back" href="./labs.html">← Labs</a> <span class="brand">Regletas 2D</span><div class="sep"></div><button id="btnOpen">Abrir / cerrar</button> <button id="btnSolve">Optimizar</button> <button id="btnTemplate">Plantilla en rejilla</button> <button id="btnHandoff">Preset handoff</button> <button id="btnJoints" class="on" title="Muestra en punteado la franja que ocupan las uniones de las esquinas: ningún agujero puede caer en ella">Uniones</button><div class="sep"></div><span class="note" id="modo">Optimizada</span></div><div class="view"><div class="card"><h2>Vista lateral del testero (y horizontal, z vertical)</h2><svg id="side" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" aria-label="Vista lateral del testero"></svg></div></div><div class="panel"><h3>Caja</h3><div class="fld"><label>Ancho W <b>mm</b></label><input id="W" type="number" min="60" max="400" step="1" value="200"></div><div class="fld"><label>Alto H <b>mm</b></label><input id="H" type="number" min="60" max="400" step="1" value="205"></div><div class="fld"><label>Niveles <b>por lado</b></label> <select id="levels"><option value="1">1</option><option value="2" selected="selected">2</option><option value="3">3</option></select></div><div class="fld"><label>Alto gaveta 1 <b>10 a 50</b></label><input id="trayH1" type="number" min="10" max="50" step="1" value="50"></div><div class="fld"><label>Alto gaveta 2 <b>10 a 50</b></label><input id="trayH2" type="number" min="10" max="50" step="1" value="40"></div><div class="fld"><label>Alto gaveta 3 <b>10 a 50</b></label><input id="trayH3" type="number" min="10" max="50" step="1" value="35"></div><div class="fld"><label>Material t <b>mm</b></label><input id="t" type="number" min="2" max="6" step="0.5" value="3"></div><div class="fld"><label>Unión de esquinas <b>franja</b></label> <select id="joint"><option value="finger" selected="selected">Dedos (1 grosor)</option><option value="reinforce">Refuerzo (2 grosores)</option></select></div><div class="fld"><label>Objetivo <b>optimizador</b></label> <select id="target"><option value="grid" selected="selected">Rejilla: más superficie libre</option><option value="handoff">Handoff: 10–15°
